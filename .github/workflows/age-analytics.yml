name: Age analytics checks
on:
  push:
    paths:
      - 'src/app/pages/dashboard-entradas/**'
      - 'scripts/test-age-analytics.cjs'
      - '.github/workflows/age-analytics.yml'
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-age-analytics.cjs
      - run: npm run build
