<div class="overlay" *ngIf="visible">
  <div class="modal" #dialog role="dialog" aria-modal="true" [attr.aria-labelledby]="titleId" (keydown)="keyboard($event)">
    <h2 [id]="titleId">{{ titulo }}</h2>
    <p>{{ mensaje }}</p>

    <div class="acciones">
      <button class="btn-cancel" (click)="onCancel()">Cancelar</button>
      <button class="btn-confirm" (click)="onConfirm()">Confirmar</button>
    </div>
  </div>
</div>
