<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>ZAIRO CLUB</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070101">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Asset principal del loader INFAMOUS -->
  <link rel="preload" as="image" href="/assets/infamous/zairo-infamous-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #070101;
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at 50% 18%, rgba(196, 28, 18, .18), transparent 30%),
        radial-gradient(circle at 50% 72%, rgba(92, 5, 4, .16), transparent 38%),
        linear-gradient(180deg, #030101 0%, #0b0202 52%, #020101 100%);
    }

    app-root {
      display: block;
      min-height: 100dvh;
      background: #070101;
    }

    .zairo-start-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      width: 100vw;
      min-height: 100dvh;
      display: grid;
      place-content: center;
      justify-items: center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      box-sizing: border-box;
      text-align: center;
      overflow: hidden;
      color: #f3e6dc;
      font-family: Inter, Arial, sans-serif;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 34%, rgba(206, 36, 24, .18), transparent 24%),
        radial-gradient(circle at 50% 68%, rgba(120, 8, 6, .15), transparent 38%),
        linear-gradient(180deg, #020101 0%, #0b0202 48%, #020101 100%);
    }

    .zairo-start-loader::before,
    .zairo-start-loader::after {
      content: "";
      position: absolute;
      inset: -16%;
      pointer-events: none;
    }

    .zairo-start-loader::before {
      z-index: -2;
      opacity: .92;
      background:
        radial-gradient(circle at 20% 28%, rgba(219, 42, 25, .10) 0 1px, transparent 2px),
        radial-gradient(circle at 74% 16%, rgba(255, 93, 54, .10) 0 1px, transparent 2px),
        radial-gradient(circle at 82% 66%, rgba(198, 31, 20, .09) 0 1px, transparent 2px),
        radial-gradient(circle at 32% 80%, rgba(255, 83, 50, .08) 0 1px, transparent 2px);
      background-size: 82px 82px, 118px 118px, 96px 96px, 140px 140px;
      animation: zairoEmbersDrift 8s linear infinite;
    }

    .zairo-start-loader::after {
      z-index: -1;
      background:
        radial-gradient(ellipse at 50% 58%, rgba(136, 12, 8, .18), transparent 32%),
        radial-gradient(ellipse at 50% 18%, rgba(230, 51, 30, .08), transparent 24%);
      filter: blur(24px);
      animation: zairoInfernoPulse 2.8s ease-in-out infinite;
    }

    .zairo-start-portal {
      position: relative;
      z-index: 2;
      width: min(252px, 62vw);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin-bottom: clamp(22px, 4vh, 34px);
    }

    .zairo-start-portal::before,
    .zairo-start-portal::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .zairo-start-portal::before {
      inset: 1%;
      border: 1px solid rgba(223, 50, 32, .54);
      box-shadow:
        0 0 18px rgba(215, 36, 24, .22),
        0 0 46px rgba(142, 8, 6, .18),
        inset 0 0 38px rgba(128, 8, 6, .16);
      animation: zairoPortalSpin 7s linear infinite;
    }

    .zairo-start-portal::after {
      inset: 11%;
      border: 1px dashed rgba(237, 77, 49, .30);
      box-shadow: 0 0 28px rgba(217, 39, 24, .14);
      animation: zairoPortalSpinReverse 5.2s linear infinite;
    }

    .zairo-start-logo-shell {
      position: relative;
      width: 72%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(80, 6, 4, .44), rgba(4, 1, 1, .92) 69%);
      box-shadow:
        0 0 42px rgba(198, 28, 18, .16),
        inset 0 0 38px rgba(158, 15, 10, .12);
      animation: zairoLogoBreathe 2.6s ease-in-out infinite;
    }

    .zairo-start-logo-shell::after {
      content: "";
      position: absolute;
      inset: -12%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(215, 34, 22, .14), transparent 60%);
      filter: blur(8px);
      z-index: -1;
    }

    .zairo-start-logo {
      width: 94%;
      height: 94%;
      object-fit: contain;
      display: block;
      filter:
        drop-shadow(0 0 12px rgba(234, 54, 34, .42))
        drop-shadow(0 0 28px rgba(151, 10, 7, .34));
    }

    .zairo-start-copy {
      position: relative;
      z-index: 3;
      width: min(760px, 92vw);
      text-align: center;
    }

    .zairo-start-kicker {
      margin: 0 0 10px;
      color: #bda999;
      font-family: "Cinzel", serif;
      font-size: clamp(10px, 1.8vw, 14px);
      font-weight: 800;
      letter-spacing: clamp(4px, .75vw, 8px);
      text-transform: uppercase;
    }

    .zairo-start-title {
      margin: 0;
      font-family: "Cinzel", serif;
      font-size: clamp(42px, 9vw, 86px);
      font-weight: 900;
      line-height: .9;
      letter-spacing: clamp(2px, .55vw, 6px);
      text-transform: uppercase;
      color: #b51d15;
      background: linear-gradient(
        180deg,
        #f6d6c3 0%,
        #d44b33 24%,
        #9b130d 62%,
        #5d0806 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(184, 26, 17, .28));
      text-shadow: 0 14px 38px rgba(0, 0, 0, .45);
    }

    .zairo-start-subtitle {
      margin: 12px 0 0;
      color: #ddc2af;
      font-family: "Cinzel", serif;
      font-size: clamp(10px, 2.2vw, 16px);
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: clamp(2px, .5vw, 5px);
      text-transform: uppercase;
    }

    .zairo-start-progress {
      position: relative;
      width: min(320px, 72vw);
      height: 1px;
      margin: 24px auto 0;
      overflow: hidden;
      background: rgba(190, 94, 67, .16);
    }

    .zairo-start-progress::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 42%;
      background: linear-gradient(90deg, transparent, #c72d20, #f28a63, transparent);
      box-shadow: 0 0 18px rgba(210, 45, 29, .55);
      animation: zairoProgressSweep 1.55s ease-in-out infinite;
    }

    .zairo-start-loading {
      display: inline-block;
      margin-top: 14px;
      color: #80695f;
      font-size: clamp(7px, 1.5vw, 9px);
      font-weight: 800;
      letter-spacing: clamp(2px, .45vw, 4px);
      text-transform: uppercase;
    }

    @keyframes zairoPortalSpin {
      from { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.02); }
      to { transform: rotate(360deg) scale(1); }
    }

    @keyframes zairoPortalSpinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes zairoLogoBreathe {
      0%, 100% { transform: scale(.98); opacity: .92; }
      50% { transform: scale(1.025); opacity: 1; }
    }

    @keyframes zairoInfernoPulse {
      0%, 100% { opacity: .62; transform: scale(.96); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    @keyframes zairoEmbersDrift {
      from { transform: translate3d(0, 3%, 0); }
      to { transform: translate3d(2%, -3%, 0); }
    }

    @keyframes zairoProgressSweep {
      0% { transform: translateX(-140%); }
      100% { transform: translateX(340%); }
    }

    @media (max-width: 560px) {
      .zairo-start-loader {
        place-content: center;
      }

      .zairo-start-portal {
        width: min(220px, 62vw);
        margin-bottom: 22px;
      }

      .zairo-start-copy {
        width: min(100%, 430px);
      }

      .zairo-start-kicker {
        margin-bottom: 8px;
        letter-spacing: 4px;
      }

      .zairo-start-title {
        font-size: clamp(42px, 15vw, 66px);
        letter-spacing: 1px;
      }

      .zairo-start-subtitle {
        margin-top: 10px;
        font-size: clamp(9px, 3.4vw, 12px);
        letter-spacing: 2px;
      }

      .zairo-start-progress {
        margin-top: 20px;
      }
    }

    @media (max-width: 360px) {
      .zairo-start-portal {
        width: min(190px, 58vw);
      }

      .zairo-start-title {
        font-size: 40px;
      }

      .zairo-start-subtitle {
        font-size: 9px;
      }
    }

    @media (max-height: 620px) and (orientation: landscape) {
      .zairo-start-loader {
        grid-auto-flow: column;
        grid-template-columns: auto minmax(280px, 1fr);
        align-items: center;
        column-gap: clamp(30px, 6vw, 72px);
      }

      .zairo-start-portal {
        width: min(190px, 32vh);
        margin: 0;
      }

      .zairo-start-copy {
        width: min(520px, 54vw);
        text-align: left;
      }

      .zairo-start-title {
        font-size: clamp(44px, 7vw, 74px);
      }

      .zairo-start-progress {
        margin-left: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .zairo-start-loader::before,
      .zairo-start-loader::after,
      .zairo-start-portal::before,
      .zairo-start-portal::after,
      .zairo-start-logo-shell,
      .zairo-start-progress::after {
        animation: none !important;
      }

      .zairo-start-progress::after {
        width: 100%;
        opacity: .6;
      }
    }
  </style>
</head>

<body>
  <app-root>
    <div
      class="zairo-start-loader"
      role="status"
      aria-live="polite"
      aria-label="Cargando ZAIRO INFAMOUS">

      <div class="zairo-start-portal" aria-hidden="true">
        <div class="zairo-start-logo-shell">
          <img
            src="/assets/infamous/zairo-infamous-logo.webp"
            alt=""
            class="zairo-start-logo">
        </div>
      </div>

      <div class="zairo-start-copy">
        <p class="zairo-start-kicker">ZAIRO PRESENTA</p>
        <h1 class="zairo-start-title">INFAMOUS</h1>
        <p class="zairo-start-subtitle">EL DESPERTAR DEL INFIERNO</p>

        <div class="zairo-start-progress" aria-hidden="true"></div>
        <span class="zairo-start-loading">ABRIENDO EL PORTAL...</span>
      </div>
    </div>
  </app-root>
</body>
</html>
